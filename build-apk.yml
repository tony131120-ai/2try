name: Build Cough Redirect APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/example/coughredirect
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'CoughRedirect'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.coughredirect'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.coughredirect'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">기침 리다이렉트</string>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CoughService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3F51B5</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/java/com/example/coughredirect/MainActivity.kt <<'EOF'
          package com.example.coughredirect

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var urlInput: EditText
              private lateinit var sensitivity: SeekBar
              private lateinit var valueText: TextView
              private val requestCode = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  urlInput = findViewById(R.id.urlInput)
                  sensitivity = findViewById(R.id.sensitivity)
                  valueText = findViewById(R.id.valueText)

                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  urlInput.setText(prefs.getString("url", "https://www.google.com"))
                  sensitivity.progress = prefs.getInt("sensitivity", 60)
                  valueText.text = "감도: ${sensitivity.progress}"

                  sensitivity.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          valueText.text = "감도: $progress"
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  findViewById<Button>(R.id.saveButton).setOnClickListener { save() }
                  findViewById<Button>(R.id.startButton).setOnClickListener { startDetection() }
                  findViewById<Button>(R.id.stopButton).setOnClickListener {
                      stopService(Intent(this, CoughService::class.java))
                  }
              }

              private fun save() {
                  var url = urlInput.text.toString().trim()
                  if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://$url"
                  urlInput.setText(url)
                  getSharedPreferences("settings", MODE_PRIVATE).edit()
                      .putString("url", url)
                      .putInt("sensitivity", sensitivity.progress)
                      .apply()
              }

              private fun startDetection() {
                  save()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), requestCode)
                      return
                  }
                  ContextCompat.startForegroundService(this, Intent(this, CoughService::class.java))
              }
          }
          EOF

          cat > android/app/src/main/res/layout_dummy <<'EOF'
          EOF

          mkdir -p android/app/src/main/res/layout
          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="기침 리다이렉트"
                  android:textSize="26sp"
                  android:textStyle="bold" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="기침이 감지되면 지정한 사이트를 엽니다.\n감지는 백그라운드에서 포그라운드 서비스로 실행됩니다." />

              <EditText
                  android:id="@+id/urlInput"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:hint="https://example.com"
                  android:inputType="textUri" />

              <Button
                  android:id="@+id/saveButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="주소 저장" />

              <TextView
                  android:id="@+id/valueText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="20dp"
                  android:text="감도: 60" />

              <SeekBar
                  android:id="@+id/sensitivity"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:max="100"
                  android:progress="60" />

              <Button
                  android:id="@+id/startButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="기침 감지 시작" />

              <Button
                  android:id="@+id/stopButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="감지 중지" />
          </LinearLayout>
          EOF

          cat > android/app/src/main/java/com/example/coughredirect/CoughService.kt <<'EOF'
          package com.example.coughredirect

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat
          import kotlin.math.abs
          import kotlin.math.sqrt

          class CoughService : Service() {
              private var recorder: AudioRecord? = null
              private var running = false
              private var thread: Thread? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(7, notification())
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!running) startListening()
                  return START_NOT_STICKY
              }

              private fun startListening() {
                  running = true
                  val sampleRate = 16000
                  val minBuffer = AudioRecord.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) { stopSelf(); return }

                  recorder = AudioRecord(
                      MediaRecorder.AudioSource.MIC,
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      minBuffer * 2
                  )
                  recorder?.startRecording()

                  thread = Thread {
                      val buffer = ShortArray(minBuffer)
                      var lastTrigger = 0L
                      while (running) {
                          val read = recorder?.read(buffer, 0, buffer.size) ?: 0
                          if (read > 0) {
                              var sum = 0.0
                              var peak = 0
                              for (i in 0 until read) {
                                  val v = abs(buffer[i].toInt())
                                  sum += v.toDouble() * v.toDouble()
                                  if (v > peak) peak = v
                              }
                              val rms = sqrt(sum / read)
                              val sensitivity = getSharedPreferences("settings", MODE_PRIVATE).getInt("sensitivity", 60)
                              val threshold = 900.0 - (sensitivity * 5.0)
                              val peakThreshold = 2500 - (sensitivity * 15)
                              val now = System.currentTimeMillis()
                              if (rms > threshold && peak > peakThreshold && now - lastTrigger > 5000) {
                                  lastTrigger = now
                                  openDestination()
                                  stopSelf()
                                  break
                              }
                          }
                      }
                  }.also { it.start() }
              }

              private fun openDestination() {
                  var url = getSharedPreferences("settings", MODE_PRIVATE).getString("url", "https://www.google.com") ?: "https://www.google.com"
                  if (!url.startsWith("http://") && !url.startsWith("https://")) url = "https://$url"
                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  try { startActivity(intent) } catch (_: Exception) { }
              }

              override fun onDestroy() {
                  running = false
                  try { recorder?.stop() } catch (_: Exception) {}
                  recorder?.release()
                  recorder = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel("cough", "기침 감지", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun notification(): Notification = NotificationCompat.Builder(this, "cough")
                  .setContentTitle("기침 리다이렉트 실행 중")
                  .setContentText("기침 소리를 감지하고 있습니다.")
                  .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                  .setOngoing(true)
                  .build()
          }
          EOF

          # Remove an intentionally empty helper file if created by the heredoc above.
          rm -f android/app/src/main/res/layout_dummy

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cough-redirect-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
